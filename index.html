<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Editor — HTML, CSS &amp; JS Playground</title>
    <meta
      name="description"
      content="A fast, private, offline-capable playground for HTML, CSS and JavaScript. Live preview, console, shareable links, no sign-up."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0e13" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Editor — HTML, CSS & JS Playground" />
    <meta
      property="og:description"
      content="A fast, private, offline-capable playground for HTML, CSS and JavaScript."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <style>
      /* Painted before the bundle evaluates so there is never a white flash. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0e13;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f6f7f9;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 14px;
        grid-auto-flow: row;
        align-content: center;
      }
      #boot .mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(140deg, #2dd4bf, #0ea5e9);
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      #boot .label {
        font: 500 13px/1 Inter, system-ui, sans-serif;
        letter-spacing: 0.02em;
        color: #6b7382;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.86);
          opacity: 0.55;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="mark"></div>
      <div class="label">Loading editor…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
